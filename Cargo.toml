[workspace]
members = ["apps/api", "apps/desktop", "crates/application", "crates/contracts", "crates/domain", "crates/money"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Optimasi maksimal (opt-level 3) tanpa memicu pipeline HLSL fxc compiler internal GPUI Windows
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 2
