[package]
name = "toko-api"
default-run = "toko-api"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
calamine = { version = "0.38.0", features = ["chrono"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
chrono = "0.4"
serde = "1"
toko-domain = { path = "../../crates/domain" }
argon2 = { version = "0.6", features = ["getrandom"] }
getrandom = "0.4"
hex = "0.4"
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "json", "chrono", "uuid"] }
subtle = "2"
toko-application = { path = "../../crates/application" }
toko-contracts = { path = "../../crates/contracts" }
uuid = { version = "1", features = ["v4"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[features]
postgres-tests = []

[[test]]
name = "postgres_foundation"
required-features = ["postgres-tests"]
