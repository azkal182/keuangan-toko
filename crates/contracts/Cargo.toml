[package]
name = "toko-contracts"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "6", features = ["chrono", "uuid"] }
uuid = { version = "1", features = ["serde"] }
